AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'resume

  SAM Template for simple application to demonstrate use of go-swagger on Lambda.

  '
Globals:
  Function:
    Timeout: 5
    MemorySize: 128
    Environment:
      Variables:
        TABLE_NAME:
          Ref: Database
Resources:
  ResumeAPI:
    Type: AWS::Serverless::Api
    Properties:
      StageName: dev
      DefinitionBody:
        Fn::Transform:
          Name: AWS::Include
          Parameters:
            Location: ../../deploy/api-gateway-swagger.yml
  ResumeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: Database
      - AWSLambdaBasicExecutionRole
      Environment:
        Variables:
          SERVICE: resume
          ENVIRONMENT: dev
          VERSION: 1.0.0
          REGION:
            Ref: AWS::Region
          TYPE: lambda
          RESUME_TABLE:
            Ref: Database
      CodeUri: ../../deploy/bootstrap.zip
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
      - arm64
      Events:
        ProxyApiRoot:
          Type: Api
          Properties:
            RestApiId:
              Ref: ResumeAPI
            Path: /
            Method: ANY
        ProxyApiGreedy:
          Type: Api
          Properties:
            RestApiId:
              Ref: ResumeAPI
            Path: /{proxy+}
            Method: ANY
  Database:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: dev-resumes2
      AttributeDefinitions:
      - AttributeName: id
        AttributeType: S
      KeySchema:
      - AttributeName: id
        KeyType: HASH
      BillingMode: PAY_PER_REQUEST
Outputs:
  ResumeFunctionArn:
    Description: REST API Handler function
    Value:
      Fn::GetAtt:
      - ResumeFunction
      - Arn
  ResumeAPIArn:
    Description: The endpoint to connect to the REST API (dev)
    Value:
      Fn::Join:
      - ''
      - - https://
        - Ref: ResumeAPI
        - .execute-api.
        - Ref: AWS::Region
        - .amazonaws.com/dev
