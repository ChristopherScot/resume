AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  resume

  SAM Template for simple application to demonstrate use of go-swagger on Lambda.

# Define the actual values of application name and env here as a string to be references later
Globals:
  Function:
    Timeout: 5
    MemorySize: 128
    # Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref Database
  # Api:
  #   TracingEnabled: true


Resources:
  ResumeAPI:
    Type: AWS::Serverless::Api
    Properties:
      StageName: dev
      DefinitionBody:
        'Fn::Transform':
          Name: 'AWS::Include'
          Parameters:
            Location: ./api-gateway-swagger.yml

  ResumeFunction:
    Type: AWS::Serverless::Function
    Properties:
      LoggingConfig:
        ApplicationLogLevel: TRACE
        LogGroup: dev--resume
        LogFormat: JSON
        SystemLogLevel: WARN
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Database
        - AWSLambdaBasicExecutionRole
      Environment:
        Variables:
          SERVICE: "resume"
          ENVIRONMENT: 'dev'
          VERSION: "1.0.0"
          REGION: !Ref 'AWS::Region'
          TYPE: "lambda"
          RESUME_TABLE: !Ref Database
      CodeUri: ./bootstrap.zip
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures: [arm64]
      Events:
        ProxyApiRoot:
          Type: Api
          Properties:
            RestApiId: !Ref ResumeAPI
            Path: /
            Method: ANY
        ProxyApiGreedy:
          Type: Api
          Properties:
            RestApiId: !Ref ResumeAPI
            Path: /{proxy+}
            Method: ANY

  Database:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: "dev-resumes2"
        AttributeDefinitions:
          - AttributeName: "id"
            AttributeType: "S"
        KeySchema:
          - AttributeName: "id"
            KeyType: "HASH"
        BillingMode: "PAY_PER_REQUEST"

Outputs:
  ResumeFunctionArn:
    Description: "REST API Handler function"
    Value: !GetAtt ResumeFunction.Arn

  ResumeAPIArn:
    Description: "The endpoint to connect to the REST API (dev)"
    Value: !Join [ '', [ 'https://', !Ref ResumeAPI, '.execute-api.',!Ref 'AWS::Region','.amazonaws.com/dev'] ]
